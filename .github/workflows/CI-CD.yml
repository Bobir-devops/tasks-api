name: CI/CD TEST

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
# 1. BUILD JOB
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build
# 2. TEST JOB

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test

# 3. DOCKER IMAGE BUILD JOB
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          docker build -t ghcr.io/$OWNER_LC/tasks-api:latest .
          docker push ghcr.io/$OWNER_LC/tasks-api:latest

# 4. DOCKER IMAGE SCAN JOB
  scan:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tasks-api .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: tasks-api
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

# 5. DEPLOY JOB
  deploy:
    needs: scan
    runs-on: self-hosted
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ansible o'rnatilganini tekshirish
        run: which ansible-playbook || (sudo apt-get update && sudo apt-get install -y ansible)

      - name: Deploy (local)
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tasks-api:latest
        run: |
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          ansible-playbook -i localhost, -c local -e "IMAGE_NAME=$IMAGE_NAME" ansible/deploy.yml

# TELEGRAM NOTIFY JOB
  notify:
    needs: [build, test, docker, scan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      TEST_STATUS: ${{ needs.test.result }}
      DOCKER_STATUS: ${{ needs.docker.result }}
      SCAN_STATUS: ${{ needs.scan.result }}
      DEPLOY_STATUS: ${{ needs.deploy.result }}
      BOT_TOKEN_RAW: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID_RAW: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notify Telegram
        run: |
          BOT_TOKEN=$(echo -n "$BOT_TOKEN_RAW" | tr -d '[:space:]')
          CHAT_ID=$(echo -n "$CHAT_ID_RAW" | tr -d '[:space:]')

          if [ "$DEPLOY_STATUS" = "success" ]; then
            ICON="✅"; MSG="Deployment successful"
          elif [ "$DEPLOY_STATUS" = "skipped" ]; then
            ICON="⛔"; MSG="Deployment SKIPPED (pipeline failed earlier)"
          else
            ICON="❌"; MSG="Deployment FAILED"
          fi

          TEXT="${ICON} *${MSG}*%0A%0A\
          *Repo:* ${{ github.repository }}%0A\
          *Branch:* ${{ github.ref_name }}%0A\
          *Author:* ${{ github.actor }}%0A\
          *Build:* ${BUILD_STATUS} \\| *Test:* ${TEST_STATUS} \\| *Docker:* ${DOCKER_STATUS} \\| *Scan:* ${SCAN_STATUS}%0A\
          *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$TEXT")

          echo "Telegram response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || (echo "Telegram xabari yetib bormadi!" && exit 1)
