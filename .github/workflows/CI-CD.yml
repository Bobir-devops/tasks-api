name: Tasks API CI/CD

on:
  push:
    branches:
      - main
      - test-ci
  pull_request:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build


  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test


  docker:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tasks-api .


  scan:
    needs: docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tasks-api .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: tasks-api
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true


  deploy:
    needs: scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tasks-api .

      - name: Run container
        run: |
          docker run -d \
            --name tasks-api \
            -p 8080:8080 \
            tasks-api


  notify:
    needs: [build, test, docker, scan, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    env:
      BUILD_STATUS: ${{ needs.build.result }}
      TEST_STATUS: ${{ needs.test.result }}
      DOCKER_STATUS: ${{ needs.docker.result }}
      SCAN_STATUS: ${{ needs.scan.result }}
      DEPLOY_STATUS: ${{ needs.deploy.result }}
      BOT_TOKEN_RAW: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHAT_ID_RAW: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Notify Telegram
        run: |
          BOT_TOKEN=$(echo -n "$BOT_TOKEN_RAW" | tr -d '[:space:]')
          CHAT_ID=$(echo -n "$CHAT_ID_RAW" | tr -d '[:space:]')

          if [ "$DEPLOY_STATUS" = "success" ]; then
            ICON="✅"; MSG="Deployment successful"
          elif [ "$DEPLOY_STATUS" = "skipped" ]; then
            ICON="⛔"; MSG="Deployment SKIPPED (pipeline failed earlier)"
          else
            ICON="❌"; MSG="Deployment FAILED"
          fi

          TEXT="${ICON} *${MSG}*%0A%0A\
          *Repo:* ${{ github.repository }}%0A\
          *Branch:* ${{ github.ref_name }}%0A\
          *Author:* ${{ github.actor }}%0A\
          *Build:* ${BUILD_STATUS} \\| *Test:* ${TEST_STATUS} \\| *Docker:* ${DOCKER_STATUS} \\| *Scan:* ${SCAN_STATUS}%0A\
          *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d parse_mode="Markdown" \
            -d text="$TEXT")

          echo "Telegram response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"ok":true' || (echo "Telegram xabari yetib bormadi!" && exit 1)
